        <div class="conteudo">
            <img src="../src/img/dmz.svg" alt="DMZ">
            <p>A DMZ é uma parte separada da rede, que fica entre a internet e a rede interna. Nela ficam os servidores que precisam ser acessados de fora, como o site de uma empresa.</p>
            <p>Se alguém invadir um servidor da DMZ, a rede interna continua protegida pelo firewall.</p>
